<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake RL — Minimal CPU Deep Q-Learning</title>
  <meta name="description" content="A minimalist, high-performance reinforcement learning showcase running purely on CPU.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- Minimal Header -->
  <header id="header">
    <div class="brand">
      <span class="brand-icon">🐍</span>
      <span class="brand-name">Snake RL</span>
      <span class="cpu-tag">CPU</span>
    </div>

    <div class="stats-row">
      <div class="stat-pill"><span class="lbl">Score</span><span class="val cyan" id="stat-score">0</span></div>
      <div class="stat-pill"><span class="lbl">Best</span><span class="val gold" id="stat-best">0</span></div>
      <div class="stat-pill"><span class="lbl">Episode</span><span class="val" id="stat-episode">1</span></div>
      <div class="stat-pill"><span class="lbl">ε</span><span class="val violet" id="stat-epsilon">1.00</span></div>
      <div class="stat-pill"><span class="lbl">SPS</span><span class="val teal" id="hdr-sps">0</span></div>
      <div class="stat-pill reward-stat-pill"><span class="lbl">Reward</span><span class="val" id="hdr-reward">+0.00</span></div>
      <button class="icon-btn" id="btn-audio" onclick="app.toggleAudio()" title="Sound ON/OFF">🔇</button>
    </div>
  </header>

  <!-- Main Showcase Viewport -->
  <main id="main">
    
    <!-- Left Stage: Arena Window & Minimal Controls -->
    <section class="arena-stage">
      <div class="board-frame" id="board-wrapper">
        <canvas id="canvas-game" width="440" height="440"></canvas>
        <canvas id="canvas-overlay" width="440" height="440"></canvas>
      </div>

      <div class="controls-dock">
        <button class="btn btn-primary" id="btn-play-pause" onclick="app.togglePlayPause()">⏸ Pause</button>
        <button class="btn btn-turbo" id="btn-turbo" onclick="app.toggleTurbo()">⚡ Turbo</button>
        <button class="btn btn-champ" id="btn-load-champion" onclick="app.loadChampionWeights()">🏆 Master Brain</button>
        <button class="btn btn-reset" onclick="app.restartFromScratch()">🔄 Reset</button>
        <div class="speed-wrap" title="Speed">
          <input type="range" class="speed-slider" id="speed-slider" min="5" max="100" value="30" oninput="app.setSpeed(this.value)">
          <span class="speed-val" id="speed-label">30/s</span>
        </div>
      </div>
    </section>

    <!-- Right Stage: Last 30 Runs Performance, Reward Signal, Decision & Brain -->
    <aside class="sidebar">

      <!-- ⭐ The Last 30 Runs Performance Panel -->
      <div class="card perf-card">
        <div class="card-header">
          <div class="card-title-group">
            <span class="card-title">Last 30 Runs</span>
            <span class="badge" id="badge-runs-trend">Learning</span>
          </div>
          <div class="perf-metrics-inline">
            <span>Avg <strong class="cyan" id="l30-avg">0.0</strong></span>
            <span>Peak <strong class="gold" id="l30-peak">0</strong></span>
          </div>
        </div>

        <div class="chart-wrap">
          <canvas id="canvas-last-30" width="370" height="115"></canvas>
          <div class="chart-tooltip" id="tooltip-last-30"></div>
        </div>

        <!-- Clean horizontal chips row with zero text spilling -->
        <div class="runs-chips-row" id="runs-history-list"></div>
      </div>

      <!-- ⚡ Live Reward & Penalty Signals Display -->
      <div class="card reward-card">
        <div class="card-header">
          <div class="card-title-group">
            <span class="card-title">Reward &amp; Penalty Signal</span>
          </div>
          <span class="reward-badge" id="badge-instant-reward">+0.00</span>
        </div>
        <div class="reward-body">
          <div class="reward-telemetry-row">
            <div class="r-metric">
              <span class="r-k">Step Reward</span>
              <span class="r-v" id="txt-step-reward">+0.00</span>
            </div>
            <div class="r-metric">
              <span class="r-k">Episode Total</span>
              <span class="r-v cyan" id="txt-cum-reward">+0.0</span>
            </div>
          </div>
          <div class="reward-matrix-strip">
            <div class="r-badge pos" id="r-matrix-food" title="Eating Food"><span class="r-icon">🍏</span> Food <strong>+10.0</strong></div>
            <div class="r-badge pos" id="r-matrix-near" title="Moving closer to food"><span class="r-icon">🎯</span> Near <strong>+0.15</strong></div>
            <div class="r-badge neg" id="r-matrix-far" title="Moving away from food"><span class="r-icon">↩️</span> Far <strong>-0.20</strong></div>
            <div class="r-badge neg" id="r-matrix-hit" title="Wall or Body Collision"><span class="r-icon">💥</span> Hit <strong>-10.0</strong></div>
          </div>
        </div>
      </div>

      <!-- Decision / Q-Values -->
      <div class="card decision-card">
        <div class="card-header">
          <span class="card-title">Decision</span>
          <span class="policy-tag" id="badge-policy-mode">Q-Policy</span>
        </div>
        <div class="q-bars-grid">
          <div class="q-item">
            <div class="q-label-line"><span>Straight</span><span class="q-val cyan" id="q-val-0">0.00</span></div>
            <div class="bar-bg"><div class="bar-fill cyan" id="q-bar-0" style="width: 33%"></div></div>
          </div>
          <div class="q-item">
            <div class="q-label-line"><span>Right</span><span class="q-val teal" id="q-val-1">0.00</span></div>
            <div class="bar-bg"><div class="bar-fill teal" id="q-bar-1" style="width: 33%"></div></div>
          </div>
          <div class="q-item">
            <div class="q-label-line"><span>Left</span><span class="q-val violet" id="q-val-2">0.00</span></div>
            <div class="bar-bg"><div class="bar-fill violet" id="q-bar-2" style="width: 33%"></div></div>
          </div>
        </div>
      </div>

      <!-- Neural Brain Activity -->
      <div class="card brain-card">
        <div class="card-header">
          <span class="card-title">Neural Brain</span>
          <span class="net-spec">16 → 64 → 32 → 3</span>
        </div>
        <div class="brain-canvas-wrap">
          <canvas id="canvas-live-brain" width="370" height="95"></canvas>
        </div>
      </div>

    </aside>
  </main>
</div>

<script src="snake-rl.js"></script>
</body>
</html>
